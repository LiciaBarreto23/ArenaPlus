<!doctype html>
<html lang="pt-BR" class="carregando">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadras · Arena+</title>
  <link rel="icon" href="/img/logoA.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="lado"></aside>
    <div>
      <header class="topo"></header>
      <main class="pagina">
        <div class="cab">
          <div>
            <h1>Quadras</h1>
            <p>Cadastre e mantenha as quadras da arena: modalidades, preço por hora e horário de funcionamento.</p>
          </div>
          <div class="acoes"><button class="btn terra" id="nova" type="button"><svg class="ico p"><use href="#i-plus"/></svg>Nova quadra</button></div>
        </div>

        <div class="barra">
          <label class="busca"><svg class="ico p"><use href="#i-search"/></svg>
            <input id="busca" type="search" placeholder="Buscar por nome ou modalidade" aria-label="Buscar quadras"></label>
          <div class="filtro" role="group" aria-label="Filtrar por situação">
            <button type="button" data-status="todas" aria-pressed="true">Todas</button>
            <button type="button" data-status="ativas" aria-pressed="false">Ativas</button>
            <button type="button" data-status="inativas" aria-pressed="false">Desativadas</button>
          </div>
          <span class="contagem" id="contagem" aria-live="polite"></span>
        </div>

        <div id="lista" class="grade" aria-busy="true"></div>
      </main>
    </div>
  </div>

  <!-- Cadastrar / editar quadra -->
  <dialog id="dlg-quadra" aria-labelledby="dq-tit">
    <form id="f-quadra" novalidate>
      <div class="dcab">
        <div><h3 id="dq-tit">Nova quadra</h3><p>Essas informações aparecem para os atletas na hora de reservar.</p></div>
        <button class="icone" type="button" data-fechar aria-label="Fechar"><svg class="ico p"><use href="#i-x"/></svg></button>
      </div>
      <div class="dcorpo">
        <p class="alerta" role="alert" tabindex="-1" hidden></p>
        <div class="campos">
          <div class="campo inteiro"><label for="q-nome">Nome da quadra</label>
            <input class="ctl" id="q-nome" name="nome" maxlength="80" placeholder="Ex: Quadra 1 - Society" autocomplete="off">
            <p class="erro" data-erro="nome"></p></div>

          <div class="campo inteiro"><span class="rotulo" id="q-mods-rot">Modalidades</span>
            <div class="chips" id="q-mods" role="group" aria-labelledby="q-mods-rot"></div>
            <div class="nova-mod">
              <input class="ctl" id="q-nova-mod" maxlength="40" placeholder="Outra modalidade" aria-label="Nome da nova modalidade">
              <button class="btn claro sm" id="q-add-mod" type="button"><svg class="ico p"><use href="#i-plus"/></svg>Adicionar</button>
            </div>
            <p class="erro" data-erro="modalidades"></p></div>

          <div class="campo"><label for="q-preco">Preço por hora</label>
            <div class="prefixo"><span>R$</span><input class="ctl" id="q-preco" name="precoHora" inputmode="decimal" placeholder="150,00"></div>
            <p class="erro" data-erro="precoHora"></p></div>
          <div class="campo"><span class="rotulo">Situação</span>
            <label class="alternar caixa"><input type="checkbox" id="q-ativa" name="ativa" checked> Disponível para reservas</label></div>

          <div class="campo"><label for="q-abre">Abre às</label>
            <input class="ctl" id="q-abre" name="horaAbertura" type="time" step="3600" value="08:00">
            <p class="erro" data-erro="horaAbertura"></p></div>
          <div class="campo"><label for="q-fecha">Fecha às</label>
            <input class="ctl" id="q-fecha" name="horaFechamento" type="time" step="3600" value="22:00">
            <p class="dica">Horas cheias (aluguel de hora em hora). Use 00:00 para meia-noite.</p>
            <p class="erro" data-erro="horaFechamento"></p></div>

          <div class="campo inteiro"><label for="q-desc">Descrição <span class="opcional">(opcional)</span></label>
            <textarea class="ctl" id="q-desc" name="descricao" maxlength="500" rows="3" placeholder="Piso, cobertura, iluminação, capacidade…"></textarea>
            <p class="erro" data-erro="descricao"></p></div>

        </div>
      </div>
      <div class="drodape">
        <button class="btn claro" type="button" data-fechar>Cancelar</button>
        <button class="btn" type="submit" id="q-salvar">Salvar quadra</button>
      </div>
    </form>
  </dialog>

  <script src="/js/app.js"></script>
  <script src="/js/quadras.js"></script>
</body>
</html>
